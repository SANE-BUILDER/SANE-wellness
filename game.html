<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANE Adaptability Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container" class="theme-awareness">
    <!-- Top HUD -->
    <div id="game-hud">
      <div id="chapter-progress" title="Progress">
        📖 <span id="chapter-count">1</span>/<span id="chapter-total">9</span>
      </div>
      <div id="game-actions">
        <button class="icon-btn" id="btn-home" title="Home">🏠</button>
        <button class="icon-btn" id="btn-restart" title="Restart">🔄</button>
      </div>
    </div>

    <h1>SANE: Adaptability</h1>
    <div id="section-title"></div>
    <div id="game-text"></div>
    <div id="choices"></div>
    <button id="nextBtn" style="display:none;">Next</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
